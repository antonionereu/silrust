name: Build silrust Android

on:
  workflow_dispatch:
  push:
    paths:
      - "silrust-v1.0b-build-corrigido.zip"
      - ".github/workflows/build-silrust.yml"

permissions:
  contents: read

jobs:
  build:
    name: silrust ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Extract corrected source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _silrust_src
          mkdir -p _silrust_src
          unzip -q silrust-v1.0b-build-corrigido.zip -d _silrust_src
          cd _silrust_src
          sha256sum -c SHA256SUMS.txt

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            _silrust_src/.tools
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
          key: silrust-tools-v6-${{ runner.os }}

      - name: Prepare Rust 1.75 + rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup target add aarch64-linux-android --toolchain 1.75.0
          rustup component add rustfmt --toolchain 1.75.0
          rustup run 1.75.0 rustfmt --version

      - name: Patch Dart analyzer compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_silrust_src/android/build-silrust-ci.sh")
          s = p.read_text(encoding="utf-8")
          bad = "--no-fatal-infos"
          if bad not in s:
              print("Aviso: --no-fatal-infos já não existe no script.")
          else:
              p.write_text(s.replace(bad, ""), encoding="utf-8")
              print("Removido --no-fatal-infos (incompatível com Dart 3.5.4).")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          bash _silrust_src/android/build-silrust-ci.sh "$GITHUB_WORKSPACE/_silrust_src" 2>&1 | tee build-silrust.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silrust-v1.0b-arm64
          path: _silrust_src/dist/silrust-v1.0b-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silrust-build-log
          path: build-silrust.log
          retention-days: 7
